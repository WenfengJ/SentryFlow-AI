<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1736"/>
      <stop offset="0.54" stop-color="#102552"/>
      <stop offset="1" stop-color="#1f73f1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f4f7fb"/>
  <rect x="40" y="40" width="1520" height="820" rx="28" fill="url(#bg)"/>

  <circle cx="1320" cy="150" r="190" fill="#facc15" opacity="0.22"/>
  <circle cx="1390" cy="220" r="95" fill="#22c55e" opacity="0.18"/>
  <path d="M1160 660 L1490 580 L1518 694 L1188 774 Z" fill="#93c5fd" opacity="0.24"/>

  <g opacity="0.28">
    <path d="M100 712 H1500" stroke="#dbeafe" stroke-width="2"/>
    <path d="M170 650 H1430" stroke="#dbeafe" stroke-width="2"/>
    <path d="M260 590 H1340" stroke="#dbeafe" stroke-width="2"/>
  </g>

  <g transform="translate(1120 540) skewX(-14)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="118" rx="18" fill="#1d4ed8"/>
    <g opacity="0.7">
      <rect x="22" y="16" width="42" height="86" fill="#bfdbfe"/>
      <rect x="78" y="16" width="42" height="86" fill="#60a5fa"/>
      <rect x="134" y="16" width="42" height="86" fill="#bfdbfe"/>
      <rect x="190" y="16" width="42" height="86" fill="#60a5fa"/>
      <rect x="246" y="16" width="32" height="86" fill="#bfdbfe"/>
    </g>
  </g>

  <g transform="translate(116 112)">
    <rect x="0" y="0" width="186" height="48" rx="24" fill="#ffffff" opacity="0.15"/>
    <text x="24" y="31" fill="#dbeafe" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="22" font-weight="700">团队旗帜</text>
  </g>

  <text x="116" y="244" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="70" font-weight="800">
    SentryFlow AI 巡检小队
  </text>
  <text x="118" y="308" fill="#bfdbfe" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="34" font-weight="650">
    让 eufy 摄像头成为海外远程能源场站的 AI 巡检员
  </text>

  <g transform="translate(116 370)">
    <rect x="0" y="0" width="880" height="240" rx="18" fill="url(#panel)" stroke="#93c5fd" stroke-opacity="0.24"/>
    <text x="34" y="56" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="30" font-weight="760">我们想做什么</text>
    <text x="34" y="108" fill="#dbeafe" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="26">
      <tspan x="34" dy="0">把摄像头从“运动提醒”升级成“巡检工作流”：</tspan>
      <tspan x="34" dy="46">识别夜间入侵、设备区异常，给出风险解释和处置建议，</tspan>
      <tspan x="34" dy="46">最后生成每日巡检报告。</tspan>
    </text>
  </g>

  <g transform="translate(1040 370)">
    <rect x="0" y="0" width="392" height="240" rx="18" fill="#0f172a" opacity="0.48" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="28" y="52" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="28" font-weight="760">正在招募 2-3 位队友</text>
    <g font-family="PingFang SC, Microsoft YaHei, Arial" font-size="22" fill="#e0f2fe">
      <text x="32" y="104">多模态 / CV · 画面风险识别</text>
      <text x="32" y="146">前端 / 产品 · Dashboard + 报告</text>
      <text x="32" y="188">IoT / 后端 · 事件流 + SDK</text>
      <text x="32" y="230">调研 / Pitch · 东南亚市场</text>
    </g>
  </g>

  <g transform="translate(116 672)" font-family="PingFang SC, Microsoft YaHei, Arial">
    <rect x="0" y="0" width="208" height="54" rx="27" fill="#ffffff" opacity="0.15"/>
    <text x="30" y="36" fill="#ffffff" font-size="22" font-weight="700">硬件 + AI</text>

    <rect x="232" y="0" width="208" height="54" rx="27" fill="#ffffff" opacity="0.15"/>
    <text x="262" y="36" fill="#ffffff" font-size="22" font-weight="700">海外场站</text>

    <rect x="464" y="0" width="208" height="54" rx="27" fill="#ffffff" opacity="0.15"/>
    <text x="494" y="36" fill="#ffffff" font-size="22" font-weight="700">工业安防</text>

    <rect x="696" y="0" width="238" height="54" rx="27" fill="#ffffff" opacity="0.15"/>
    <text x="726" y="36" fill="#ffffff" font-size="22" font-weight="700">可演示闭环</text>

    <rect x="958" y="0" width="278" height="54" rx="27" fill="#ffffff" opacity="0.15"/>
    <text x="988" y="36" fill="#ffffff" font-size="22" font-weight="700">东南亚市场调研</text>
  </g>

  <text x="116" y="802" fill="#dbeafe" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24">
    不预设固定队长，哪个方向谁更擅长，就由谁来主导。
  </text>
</svg>
